# Add to Streamlit Community Cloud -> App settings -> Secrets (do not commit real values)
GEMINI_API_KEY = "replace-with-your-gemini-api-key"
oauth_state_secret = "replace-with-a-long-random-secret-at-least-32-characters"
[google_oauth]
client_id = "your-google-oauth-web-client-id"
client_secret = "your-google-oauth-web-client-secret"
redirect_uri = "https://YOUR-APP-NAME.streamlit.app/"
